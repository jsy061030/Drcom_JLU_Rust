name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build (release)
        run: cargo build --release

      # 产物：CLI 二进制 + C 动态库/静态库/导入库
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drcom-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            target/release/drcom-client
            target/release/drcom-client.exe
            target/release/libdrcom.so
            target/release/libdrcom.dylib
            target/release/drcom.dll
            target/release/drcom.dll.lib
            target/release/drcom.lib
            target/release/libdrcom.a
