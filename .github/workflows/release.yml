name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="drcom-${TARGET}"
          rel="target/${TARGET}/release"
          mkdir -p "dist/${name}"

          # CLI 二进制
          if [ -e "${rel}/drcom-client" ]; then cp "${rel}/drcom-client" "dist/${name}/"; fi
          if [ -e "${rel}/drcom-client.exe" ]; then cp "${rel}/drcom-client.exe" "dist/${name}/"; fi

          # C 动态库 / 静态库 / Windows 导入库
          for pat in libdrcom.so libdrcom.dylib drcom.dll drcom.dll.lib drcom.lib libdrcom.a; do
            if [ -e "${rel}/${pat}" ]; then cp "${rel}/${pat}" "dist/${name}/"; fi
          done

          # 头文件与文档
          cp include/drcom.h drcom.toml.example README.md LIBRARY_USAGE.md C_API.md "dist/${name}/"

          echo "--- packaged ---"
          ls -la "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: drcom-${{ matrix.target }}
          path: dist/drcom-${{ matrix.target }}/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Bundle into zip archives
        run: |
          set -euo pipefail
          mkdir -p out
          cd artifacts
          for d in */; do
            base="${d%/}"
            ( cd "${base}" && zip -r "../../out/${base}.zip" . )
          done
          echo "--- archives ---"
          ls -la ../out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
